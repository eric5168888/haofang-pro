name: Build Android APK (好房通 Pro)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 檢出專案
        uses: actions/checkout@v4

      - name: 2. 安裝 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. 安裝 Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. 建立好房通 Pro 專案設定檔
        run: |
          mkdir -p src
          echo '{"name":"haofang-pro","private":true,"version":"1.2.0","type":"module","scripts":{"dev":"vite","build":"vite build"},"dependencies":{"@capacitor/android":"^6.1.0","@capacitor/cli":"^6.1.0","@capacitor/core":"^6.1.0","lucide-react":"^0.400.0","react":"^18.3.1","react-dom":"^18.3.1"},"devDependencies":{"@vitejs/plugin-react":"^4.3.0","vite":"^5.3.0"}}' > package.json
          echo 'import { defineConfig } from "vite"; import react from "@vitejs/plugin-react"; export default defineConfig({ plugins: [react()] });' > vite.config.js
          echo '<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>好房通 Pro</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-900"><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>' > index.html
          echo 'import React from "react"; import ReactDOM from "react-dom/client"; import App from "./App.jsx"; ReactDOM.createRoot(document.getElementById("root")).render(<React.StrictMode><App /></React.StrictMode>);' > src/main.jsx
          echo '{"appId":"com.twrealty.haofangpro","appName":"好房通 Pro","webDir":"dist"}' > capacitor.config.json

