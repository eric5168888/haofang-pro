name: Build Android APK (好房通 Pro)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 檢出專案
        uses: actions/checkout@v4

      - name: 2. 安裝 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. 安裝 Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. 強制建立乾淨的好房通 Pro 專案與 App.jsx
        run: |
          mkdir -p src
          
          cat << 'EOF' > package.json
          {
            "name": "haofang-pro",
            "private": true,
            "version": "1.2.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/cli": "^6.1.0",
              "@capacitor/core": "^6.1.0",
              "lucide-react": "^0.400.0",
              "react": "^18.3.1",
              "react-dom": "^18.3.1"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "^4.3.0",
              "vite": "^5.3.0"
            }
          }
          EOF

          cat << 'EOF' > vite.config.js
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          export default defineConfig({ plugins: [react()] });
          EOF

          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="zh-TW">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>好房通 Pro</title>
              <script src="https://cdn.tailwindcss.com"></script>
            </head>
            <body class="bg-slate-900">
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          cat << 'EOF' > src/main.jsx
          import React from "react";
          import ReactDOM from "react-dom/client";
          import App from "./App.jsx";
          ReactDOM.createRoot(document.getElementById("root")).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>
          );
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.twrealty.haofangpro",
            "appName": "好房通 Pro",
            "webDir": "dist"
          }
          EOF

          cat << 'APPEOF' > src/App.jsx
          import React, { useState, useEffect } from 'react';
          import { Building2, Users, Calendar, Calculator, KeyRound, Phone, Plus, CheckCircle2, Search } from 'lucide-react';

          export default function App() {
            const [tab, setTab] = useState('listings');
            const [search, setSearch] = useState('');

            const [listings, setListings] = useState(() => {
              const saved = localStorage.getItem('hf_listings');
              return saved ? JSON.parse(saved) : [
                { id: 1, title: '左營高鐵・景觀三房平車', area: '高雄市左營區重愛路', price: 1880, size: 46.5, rooms: '3房2廳2衛', status: '專任委託', owner: '陳先生', phone: '0912-345-678' },
                { id: 2, title: '鳳山文山特區・帝王座向大四房', area: '高雄市鳳山區文衡路', price: 2450, size: 58.2, rooms: '4房2廳2衛', status: '一般委託', owner: '林小姐', phone: '0928-888-168' },
                { id: 3, title: '農十六美術館・豪宅首排雙平車', area: '高雄市鼓山區美術東二路', price: 3980, size: 78.0, rooms: '4房2廳3衛', status: '專任委託', owner: '張董事長', phone: '0933-111-222' }
              ];
            });

            const [rentals, setRentals] = useState(() => {
              const saved = localStorage.getItem('hf_rentals');
              return saved ? JSON.parse(saved) : [
                { id: 1, title: '左營高鐵・溫馨兩房含管平車', tenant: '王小明', phone: '0955-123-456', rent: 26000, paid: true, tag: '300億租金補貼', elec: '4520度', water: '312度' },
                { id: 2, title: '鳳山文山・全新未住正三房', tenant: '李美玲', phone: '0966-789-012', rent: 32000, paid: false, tag: '社宅包租代管', elec: '1280度', water: '95度' },
                { id: 3, title: '亞灣區・海景高樓層精品一房', tenant: '黃工程師', phone: '0977-333-999', rent: 21000, paid: false, tag: '一般代管', elec: '2890度', water: '180度' }
              ];
            });

            const [clients, setClients] = useState(() => {
              const saved = localStorage.getItem('hf_clients');
              return saved ? JSON.parse(saved) : [
                { id: 1, name: '吳醫師 (買方)', budget: '2500萬內', pref: '左營/鼓山 3~4房平車', phone: '0911-222-333', note: '本週六下午可看屋，重視採光與學區' },
                { id: 2, name: '蔡經理 (買方)', budget: '1800萬內', pref: '鳳山文山特區 3房', phone: '0922-444-555', note: '自備款充足，喜歡可馬上出價斡旋' }
              ];
            });

            const [schedules, setSchedules] = useState(() => {
              const saved = localStorage.getItem('hf_schedules');
              return saved ? JSON.parse(saved) : [
                { id: 1, time: '今日 14:30', title: '帶看：左營高鐵景觀三房', client: '吳醫師', done: false, note: '警衛室換證借鑰匙' },
                { id: 2, time: '今日 19:00', title: '收斡旋：鳳山文山大四房', client: '蔡經理', done: false, note: '準備實價登錄行情表' }
              ];
            });

            const [loanPrice, setLoanPrice] = useState(1880);
            const [loanRatio, setLoanRatio] = useState(80);
            const [loanYears, setLoanYears] = useState(40);
            const [loanRate, setLoanRate] = useState(1.775);

            useEffect(() => { localStorage.setItem('hf_listings', JSON.stringify(listings)); }, [listings]);
            useEffect(() => { localStorage.setItem('hf_rentals', JSON.stringify(rentals)); }, [rentals]);
            useEffect(() => { localStorage.setItem('hf_clients', JSON.stringify(clients)); }, [clients]);
            useEffect(() => { localStorage.setItem('hf_schedules', JSON.stringify(schedules)); }, [schedules]);

            const loanAmount = Math.round(loanPrice * (loanRatio / 100));
            const monthlyRate = (loanRate / 100) / 12;
            const totalMonths = loanYears * 12;
            const monthlyPay = Math.round((loanAmount * 10000 * monthlyRate * Math.pow(1 + monthlyRate, totalMonths)) / (Math.pow(1 + monthlyRate, totalMonths) - 1));

            return (
              <div className="min-h-screen bg-slate-950 text-slate-100 pb-24 font-sans">
                <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-20 flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <div className="bg-emerald-500 p-2 rounded-xl text-slate-950 font-bold"><Building2 size={20} /></div>
                    <div>
                      <h1 className="font-bold text-base text-white">好房通 Pro</h1>
                      <p className="text-xs text-emerald-400">台灣房仲與包租代管行動系統</p>
                    </div>
                  </div>
                  <span className="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-full">離線自動儲存中</span>
                </header>

                <main className="p-4 max-w-md mx-auto space-y-4">
                  {tab === 'listings' && (
                    <>
                      <div className="flex gap-2">
                        <div className="relative flex-1">
                          <Search size={16} className="absolute left-3 top-3 text-slate-400" />
                          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="搜尋案名或路段..." className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-sm text-white" />
                        </div>
                        <button onClick={() => {
                          const title = prompt('輸入新物件案名：');
                          const price = Number(prompt('輸入開價(萬)：', '1980'));
                          if (title && price) setListings([{ id: Date.now(), title, area: '高雄市', price, size: 45, rooms: '3房2廳2衛', status: '專任委託', owner: '新屋主', phone: '0900-000-000' }, ...listings]);
                        }} className="bg-emerald-500 text-slate-950 font-bold px-3 py-2 rounded-xl text-sm flex items-center gap-1"><Plus size={16}/>新增</button>
                      </div>
                      {listings.filter(l => l.title.includes(search) || l.area.includes(search)).map(item => (
                        <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                          <div className="flex justify-between items-start">
                            <span className="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full">{item.status}</span>
                            <span className="text-lg font-extrabold text-amber-400">{item.price} 萬</span>
                          </div>
                          <h3 className="font-bold text-white text-base">{item.title}</h3>
                          <p className="text-xs text-slate-400">{item.area} ｜ {item.size}坪 ｜ {item.rooms}</p>
                          <div className="pt-2 border-t border-slate-800 flex justify-between items-center text-xs">
                            <span className="text-slate-300">屋主：{item.owner}</span>
                            <div className="flex gap-2">
                              <a href={`tel:${item.phone}`} className="bg-slate-800 px-2.5 py-1.5 rounded-lg text-emerald-400 flex items-center gap-1"><Phone size={12}/>撥號</a>
                              <button onClick={() => { setLoanPrice(item.price); setTab('calc'); }} className="bg-amber-500/20 text-amber-300 px-2.5 py-1.5 rounded-lg">帶入試算</button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </>
                  )}

                  {tab === 'rentals' && (
                    <>
                      <div className="bg-gradient-to-r from-emerald-900/60 to-slate-900 border border-emerald-700/40 rounded-2xl p-4 flex justify-between items-center">
                        <div>
                          <p className="text-xs text-emerald-300">本月包租代管應收總額</p>
                          <p className="text-2xl font-extrabold text-white mt-1">NT$ {rentals.reduce((s, r) => s + r.rent, 0).toLocaleString()}</p>
                        </div>
                        <button onClick={() => {
                          const title = prompt('輸入出租物件名稱：');
                          const tenant = prompt('輸入房客姓名：');
                          const rent = Number(prompt('輸入月租金(元)：', '25000'));
                          if (title && tenant) setRentals([{ id: Date.now(), title, tenant, phone: '0912-000-000', rent, paid: false, tag: '300億租金補貼', elec: '1000度', water: '100度' }, ...rentals]);
                        }} className="bg-emerald-500 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1"><Plus size={14}/>新增租約</button>
                      </div>
                      {rentals.map(r => (
                        <div key={r.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                          <div className="flex justify-between">
                            <span className="text-xs bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full">{r.tag}</span>
                            <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${r.paid ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}`}>{r.paid ? '本月已收租' : '待催繳'}</span>
                          </div>
                          <h3 className="font-bold text-white">{r.title}</h3>
                          <p className="text-xs text-slate-400">租客：{r.tenant} ｜ 月租：${r.rent.toLocaleString()} ｜ 點交電錶：{r.elec}</p>
                          <div className="pt-2 border-t border-slate-800 flex justify-between items-center">
                            <a href={`tel:${r.phone}`} className="text-xs text-emerald-400 flex items-center gap-1"><Phone size={12}/>聯絡房客</a>
                            <button onClick={() => setRentals(rentals.map(x => x.id === r.id ? { ...x, paid: !x.paid } : x))} className="bg-emerald-500 text-slate-950 font-bold px-3 py-1 rounded-lg text-xs">
                              {r.paid ? '改為未收' : '一鍵確認收租'}
                            </button>
                          </div>
                        </div>
                      ))}
                    </>
                  )}

                  {tab === 'clients' && (
                    <>
                      <button onClick={() => {
                        const name = prompt('輸入客戶稱呼：');
                        const budget = prompt('輸入購屋預算：', '2000萬內');
                        const pref = prompt('輸入需求條件：', '三房平車');
                        if (name) setClients([{ id: Date.now(), name, budget, pref, phone: '0900-111-222', note: '新開發客戶' }, ...clients]);
                      }} className="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-sm flex justify-center items-center gap-1"><Plus size={16}/>新增買賣方客戶</button>
                      {clients.map(c => (
                        <div key={c.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                          <div className="flex justify-between">
                            <h3 className="font-bold text-white">{c.name}</h3>
                            <span className="text-xs text-amber-400 font-bold">預算：{c.budget}</span>
                          </div>
                          <p className="text-xs text-emerald-300">需求：{c.pref}</p>
                          <p className="text-xs text-slate-400 bg-slate-950 p-2 rounded-lg">{c.note}</p>
                          <div className="flex justify-end gap-2 pt-1">
                            <a href={`tel:${c.phone}`} className="bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-lg text-xs flex items-center gap-1"><Phone size={12}/>撥打電話</a>
                          </div>
                        </div>
                      ))}
                    </>
                  )}

                  {tab === 'schedule' && (
                    <>
                      <button onClick={() => {
                        const time = prompt('輸入時間：', '明日 15:00');
                        const title = prompt('輸入行程內容：', '帶看美術館三房');
                        if (time && title) setSchedules([{ id: Date.now(), time, title, client: '客戶', done: false, note: '準時出發' }, ...schedules]);
                      }} className="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-sm flex justify-center items-center gap-1"><Plus size={16}/>新增帶看行程</button>
                      {schedules.map(s => (
                        <div key={s.id} onClick={() => setSchedules(schedules.map(x => x.id === s.id ? { ...x, done: !x.done } : x))} className={`bg-slate-900 border rounded-2xl p-4 flex justify-between items-center cursor-pointer ${s.done ? 'border-emerald-800 opacity-60' : 'border-slate-800'}`}>
                          <div>
                            <span className="text-xs text-amber-400 font-bold">{s.time}</span>
                            <h3 className={`font-bold text-white ${s.done ? 'line-through' : ''}`}>{s.title}</h3>
                            <p className="text-xs text-slate-400">{s.note}</p>
                          </div>
                          <CheckCircle2 className={s.done ? 'text-emerald-400' : 'text-slate-600'} />
                        </div>
                      ))}
                    </>
                  )}

                  {tab === 'calc' && (
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
                      <h2 className="font-bold text-white text-base">房貸與交屋稅費試算</h2>
                      <div className="flex gap-2">
                        <button onClick={() => { setLoanRate(1.775); setLoanYears(40); setLoanRatio(80); }} className="flex-1 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 py-1.5 rounded-lg text-xs font-bold">新青安 1.775%</button>
                        <button onClick={() => { setLoanRate(2.185); setLoanYears(30); setLoanRatio(80); }} className="flex-1 bg-slate-800 text-slate-300 py-1.5 rounded-lg text-xs">首購地板 2.185%</button>
                      </div>
                      <div className="space-y-2 text-xs">
                        <label className="block text-slate-400">成交總價（萬）：<input type="number" value={loanPrice} onChange={e => setLoanPrice(Number(e.target.value))} className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-sm" /></label>
                        <label className="block text-slate-400">貸款成數（%）：<input type="number" value={loanRatio} onChange={e => setLoanRatio(Number(e.target.value))} className="w-full mt-1 bg-
