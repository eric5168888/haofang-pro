name: Build Android APK (好房通 Pro)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出專案原始碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Node.js 20 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安裝 Java JDK 17 (Android 編譯必備)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. 安裝套件並編譯 React 網頁加上 Capacitor Android
        run: |
          npm install
          npm run build
          npx cap add android || npx cap sync android

      - name: 5. 使用 Gradle 打包可安裝的 Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. 匯出好房通Pro安裝檔 (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: 好房通Pro-Android-APK-安裝檔
          path: android/app/build/outputs/apk/debug/app-debug.apk
